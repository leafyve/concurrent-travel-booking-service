# Alembic configuration.
# The database URL is injected at runtime from app settings (see alembic/env.py),
# so no connection string is hard-coded here.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# Use UTC, sortable revision filenames.
timezone = UTC
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
# Migrations are formatted explicitly via `make migrate-format` (ruff ships as a
# standalone binary rather than a console_scripts entrypoint), so no post-write
# hook is configured here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
